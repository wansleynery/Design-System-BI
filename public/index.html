<!--@JSP_DIRETIVAS@-->
<!--
  Esta e a tela. O scripts/zip.js a transforma em build/index.jsp, embutindo o bundle.

  Por que .html e nao .jsp: o react-scripts EXIGE public/index.html (build.js:50 aborta sem
  ele), entao manter os dois seria duplicacao.

  ATENCAO: nao escreva scriptlets de JSP neste arquivo, nem dentro de comentarios. O
  HtmlWebpackPlugin passa tudo pelo lodash/template, que avalia a abertura de scriptlet como
  JavaScript e quebra o build — inclusive quando ela aparece so em prosa. Por isso as
  diretivas e o acesso a sessao viram marcadores, preenchidos por scripts/zip.js.

  A interpolacao da pasta base, essa sim, pode ficar literal no corpo da pagina: o loader do
  HtmlWebpackPlugin passa um `interpolate` proprio, e o lodash so ativa o modo ES-template
  quando esse regex e o default por referencia. Verificado. (Nao escrita aqui de proposito:
  o container tambem a resolveria dentro deste comentario, vazando o caminho no HTML.)

  Marcadores preenchidos por scripts/zip.js, um de cada, procure por "@" abaixo:
    JSP_DIRETIVAS  as tres diretivas de pagina (tem que ser a primeira linha do arquivo)
    JSP_USUARIO    a expressao que le o usuario logado da sessao
    BI_STYLE       tema ez-design + main.css, com as fontes woff2 em base64
    BI_SCRIPT      os 143 arquivos de JS concatenados

  Nao cite os marcadores por extenso aqui: a substituicao exige exatamente uma ocorrencia de
  cada, e uma citacao a mais faz o bundle ser embutido duas vezes.

  No `npm start` os marcadores ficam como estao e os scripts /mge/ dao 404. A tela monta
  assim mesmo: o removerFrame nao acha DashWindow fora de um gadget e retorna calado.
-->

<html lang="pt-BR">

<head>

    <!-- Cosmetico: a tela roda dentro de um iframe do shell, entao quem aparece na aba do -->
    <!-- navegador e o titulo do Sankhya, nunca este. Vale pelo DevTools, que nomeia o     -->
    <!-- frame por ele, e pela pagina aberta direto pela URL.                              -->
    <title>Componente BI</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content= "width=device-width, initial-scale=1.0" />

    <!-- **                                                                                                    -->
    <!-- ** SEM ANGULARJS.                                                                                     -->
    <!-- **                                                                                                    -->
    <!-- ** A tela e 100% React + web components ez- e snk-. Nada do que ela precisa depende do AngularJS:     -->
    <!-- ** o caminho vem da pasta interpolada, a sessao vem do JSP e os dados vem do BFF, pelo sankhyablocks. -->
    <!-- ** Por isso saem daqui angular*.js, angular-material, snk.js, launcher.js, ui-grid, ui-bootstrap,     -->
    <!-- ** jqwidgets, tinymce, ace, bpmn, fullcalendar e os CSS que os acompanham — sao ~30 requests que so   -->
    <!-- ** existiriam para alimentar diretivas que esta tela nao usa, e o bootstrap.min.css/snk.min.css ainda -->
    <!-- ** brigariam com os tokens do ez-design.                                                              -->
    <!-- **                                                                                                    -->
    <!-- ** ag-grid-enterprise.js tambem sai: o ez-grid traz a propria copia do AG Grid dentro do bundle.      -->
    <!-- **                                                                                                    -->

    <!-- Estilizacao base -->
        <style>
            /* **                                                                             */
            /* ** AS DUAS MEDIDAS DA TELA                                                     */
            /* **                                                                             */
            /* ** Declaradas aqui porque varias regras abaixo dependem delas, e mais de uma    */
            /* ** precisa da altura util (viewport menos a moldura) dentro de um calc — as     */
            /* ** folhas da lib usam 100vh cru e nao sabem que existe moldura.                 */
            /* **                                                                             */
            /* ** Valores literais, e nao var(--space--large) / var(--space--medium): o tema   */
            /* ** ez-design so e embutido no build, entao o editor marcaria o token como nao   */
            /* ** resolvido aqui. Os valores batem com os do tema (24px e 12px).               */
            /* **                                                                             */
            :root {
                --bi--moldura:       24px;   /* padding do #root: a moldura unica da tela */
                --bi--respiro-grade: 12px;   /* gutter interno da grade e do rodape       */

                --bi--altura-util:   calc(100vh - (var(--bi--moldura) * 2));
            }

            html, body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            #root {
                height: 100%;
                overflow: hidden;
                display: flex;
                flex-direction: column;

                padding: var(--bi--moldura);
                box-sizing: border-box;
            }

            /* **                                                                             */
            /* ** CADEIA DE ALTURA                                                            */
            /* **                                                                             */
            /* ** snk-application e snk-crud declaram :host { display:flex; height:100% },    */
            /* ** mas o snk-data-unit NAO tem CSS proprio e o :host do snk-grid.css so define */
            /* ** variaveis (--snk-grid-min-height, --snk-grid-padding) — nenhum display nem  */
            /* ** altura. Os dois viram display:inline e quebram a cadeia no meio: o          */
            /* ** height:100% do .snk-grid__container passa a resolver contra uma caixa de    */
            /* ** altura automatica, a grade encolhe para o conteudo e o resto do painel fica */
            /* ** vazio.                                                                      */
            /* **                                                                             */
            /* ** O snk-grid esta na lista porque a tela chegou a monta-lo direto sob o       */
            /* ** snk-data-unit, sem snk-crud. Com o snk-crud de volta a regra e inofensiva — */
            /* ** o stack-item que o envolve ja e flex-column de altura cheia — e continua    */
            /* ** valendo se a composicao mudar de novo.                                      */
            /* **                                                                             */
            snk-application,
            snk-data-unit,
            snk-grid {
                display: flex;
                flex-direction: column;
                flex: 1 1 auto;

                /* Sem isto um filho que transborda impede o flex de encolher o container. */
                min-height: 0;
            }

            /* **                                                                             */
            /* ** BOTOES DE TOPO COLADOS NA GRADE                                             */
            /* **                                                                             */
            /* ** O .snk-grid__header e uma linha flex (justify-content: flex-end) sem altura  */
            /* ** nem margem proprias — a altura dele e a do maior filho, e os botoes, de 32px */
            /* ** e altura fixa, ficam encostados no topo dessa caixa.                         */
            /* **                                                                             */
            /* ** Na tela nativa esse header mede 49.33px porque la existem outros dois        */
            /* ** filhos: a snk-filter-bar, cuja linha de chips tem 37px (o <hr> so estica ate */
            /* ** ela, ja que .ez-divider-vertical e height: auto), e o proprio <hr>, que leva */
            /* ** margin-bottom: var(--space--medium) — 37 + 12, com o resto em subpixel. Sao  */
            /* ** esses 12px que afastam o card da grade, e os 17px que sobram abaixo dos      */
            /* ** botoes vem da linha de chips ser mais alta que eles.                         */
            /* **                                                                             */
            /* ** O snk-grid so renderiza a filter-bar (e com ela o hr) quando a config de     */
            /* ** filtro nao vem vazia — snk-grid.js, _showSnkFilterBar. Sem barra, o header   */
            /* ** encolhe para os 32px dos botoes e eles encostam na grade.                    */
            /* **                                                                             */
            /* ** Reservar a mesma altura reproduz a caixa nativa e nao soma nada quando a     */
            /* ** barra voltar: com ela o header ja passa desse minimo por conta propria.      */
            /* **                                                                             */
            .snk-grid__header {
                /* 37px da linha de chips + o respiro da grade na margem do divisor. */
                min-height: calc(37px + var(--bi--respiro-grade));
            }

            /* **                                                                             */
            /* ** MODO FORMULARIO: O SNK-GUIDES-VIEWER PRESSUPOE UM CONTAINER DE SCROLL       */
            /* **                                                                             */
            /* ** Tres decisoes da folha dele so fecham dentro de algo que rola:              */
            /* **                                                                             */
            /* **   .snk-guides-viewer__header          position: sticky; top: 0              */
            /* **   .snk-guides-viewer__guide-navigator position: sticky; top: 76px           */
            /* **   .snk-guides-viewer__container       height: 100%   (sem descontar o       */
            /* **                                       cabecalho que vem acima dele)         */
            /* **                                                                             */
            /* ** Nesta tela nada rola — html, body e #root sao overflow:hidden, porque a      */
            /* ** grade cuida da propria rolagem. Sem scrollport, medido na tela no modo       */
            /* ** formulario:                                                                  */
            /* **                                                                              */
            /* **   cabecalho  top 24   bottom 92                                              */
            /* **   container  top 76   bottom 1346    (viewport 1318)                         */
            /* **                                                                              */
            /* ** ou seja, o conteudo comeca 16px ACIMA do fim do cabecalho — passa por baixo  */
            /* ** dele — e ainda transborda 52px alem da caixa util. Os dois sticky ficam      */
            /* ** inertes, na posicao estatica.                                                */
            /* **                                                                              */
            /* ** Delimitar a altura do proprio snk-guides-viewer e dar overflow a ele resolve */
            /* ** os tres de uma vez: vira o scrollport que a lib procura, o cabecalho gruda   */
            /* ** no topo dele, o navegador gruda nos 76px, e o que exceder rola em vez de ser */
            /* ** cortado. E o comportamento da tela nativa.                                   */
            /* **                                                                              */
            /* ** Escopo minimo de proposito: mexer no ez-view-stack quebraria o mecanismo de  */
            /* ** troca de views do snk-crud, que alterna visibility/display entre stack-items.*/
            /* **                                                                              */
            snk-guides-viewer {
                display: block;

                max-height: var(--bi--altura-util);
                overflow-y: auto;
            }

            /* **                                                                             */
            /* ** MODO FORMULARIO: O PAINEL DE GUIAS SE MEDE PELA VIEWPORT, NAO PELA CAIXA    */
            /* **                                                                             */
            /* ** O snk-guides-viewer.css dimensiona o navegador de guias assim:              */
            /* **                                                                             */
            /* **   .snk-guides-viewer__guide-navigator {                                     */
            /* **     position: sticky;                                                        */
            /* **     height: calc(100vh - <header 68px> - <large 24px> - <small 8px>);        */
            /* **   }                                                                          */
            /* **                                                                             */
            /* ** O 100vh e a viewport INTEIRA. Numa tela nativa isso fecha, porque o conteudo */
            /* ** ocupa a janela toda. Aqui nao: tudo vive dentro do #root, que tem a moldura  */
            /* ** em cima e embaixo. Sobra --bi--altura-util, e o painel se acha uma moldura   */
            /* ** inteira maior do que a caixa — a lista de guias termina cortada, sem alcance */
            /* ** para os ultimos itens.                                                      */
            /* **                                                                             */
            /* ** Refazer o calculo sobre --bi--altura-util preserva a intencao do original em */
            /* ** vez de trocar por altura fixa, e acompanha sozinho se a moldura mudar.       */
            /* **                                                                             */
            /* ** O seletor precisa da tag junto das duas classes: o Stencil injeta a folha do */
            /* ** componente no <head> DEPOIS deste bloco, entao empatar em especificidade     */
            /* ** perde. Com ez-guide-navigator no meio ganhamos por um elemento.              */
            /* **                                                                             */
            .snk-guides-viewer__container > ez-guide-navigator.snk-guides-viewer__guide-navigator {
                height: calc(var(--bi--altura-util)
                             - var(--snk-guides-viewer__header--min-height, 68px)
                             - var(--snk-guides-viewer--space-large, 24px)
                             - var(--snk-guides-viewer--space-small, 8px));
            }

            /* **                                                                             */
            /* ** RODAPE DE TOTAIS DA GRADE                                                   */
            /* **                                                                             */
            /* ** O snk-grid renderiza um <slot name="SnkGridFooter"> depois da ez-grid, e o  */
            /* ** snk-crud o repassa (snk-crud.js:363) — e por ele que o src/Rodape.tsx entra. */
            /* **                                                                             */
            /* ** A lib NAO estiliza esse conteudo: na tela nativa de Movimentacao Financeira  */
            /* ** as classes .footer-totals e .total-indicator__icon vem da propria labsApp    */
            /* ** dela, nao do ezui nem do sankhyablocks.                                     */
            /* **                                                                             */
            /* ** O layout do rodape NAO esta aqui: linha, alinhamento e espacamento sao       */
            /* ** utilitarias do tema (ez-row, ez-align--middle, ez-padding-*), aplicadas no   */
            /* ** src/Rodape.tsx — as mesmas que os cartoes ja usavam. Sobra so o circulo do   */
            /* ** icone, que nao tem equivalente no tema.                                     */
            /* **                                                                             */
            /* ** As cores saem de tokens que EXISTEM no ez-themed.css: --color--success (:53) */
            /* ** e --color--success-200 (:54), --color--error (:55) e --color--error-200      */
            /* ** (:56). O par -200 e o fundo tonalizado que o proprio design system usa nesse */
            /* ** papel (ez-themed.css:1363, no ez-badge). Os fallbacks repetem os valores     */
            /* ** reais desses tokens, nao aproximacoes.                                      */
            /* **                                                                             */
            .total-indicator__icon {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 32px;
                height: 32px;
                flex: 0 0 auto;
                border-radius: 50%;
                background-color: var(--background--medium, rgba(127, 127, 127, .12));
                color: var(--text--primary);
            }

            .total-indicator__icon--positivo {
                background-color: var(--color--success-200, #EBFFFA);
                color: var(--color--success, #00cb94);
            }

            .total-indicator__icon--negativo {
                background-color: var(--color--error-200, #F7E0E5);
                color: var(--color--error, #DA4453);
            }

            /* O ez-icon herda a cor por esta variavel, nao por `color`. */
            .total-indicator__icon ez-icon {
                --ez-icon--color: currentColor;
            }

            /* **                                                                             */
            /* ** ez-margin-bottom--small: 12px NO LUGAR DOS 6px DO TEMA                      */
            /* **                                                                             */
            /* ** O tema define 6px (ez-themed.css:639-640, var --space--small). Aqui a folga  */
            /* ** de 6px e apertada demais entre os cartoes do rodape.                        */
            /* **                                                                             */
            /* ** Global, e nao escopado, porque o raio de alcance foi conferido e e pequeno:  */
            /* ** so dois componentes das libs usam essa utilitaria — o editor de filtro       */
            /* ** personalizado e o snk-layout-form-config —, os dois em telas de configuracao */
            /* ** onde 6px a mais de respiro nao muda nada. Se algum dia isso incomodar, o     */
            /* ** conserto e prefixar com .footer-totals.                                     */
            /* **                                                                             */
            /* ** O !important e necessario: o marcador do tema fica DEPOIS deste bloco (o     */
            /* ** <style> vai ate a linha ~457 e o BI_STYLE entra em seguida), e a utilitaria  */
            /* ** do tema tem uma classe so — empatar em especificidade perde pela ordem.      */
            /* ** Mesma razao das regras de padding logo abaixo, que resolvem o empate com     */
            /* ** duas classes; aqui nao ha segunda classe para usar.                          */
            /* **                                                                             */
            .ez-margin-bottom--small {
                margin-bottom: var(--bi--respiro-grade) !important;
            }

            /* **                                                                             */
            /* ** BARRA DE FILTROS: SEM MARGEM SUPERIOR                                       */
            /* **                                                                             */
            /* ** Duas margens desalinham os itens da barra em relacao ao resto do cabecalho:  */
            /* **                                                                             */
            /* **   .snk-filter-bar__filter-item-container  margin: 2px 0   snk-filter-bar.css:106 */
            /* **   .ez-margin-top--extra-small             no botao "+ Filtros"                   */
            /* **                                          snk-filter-bar.js:540                   */
            /* **                                                                             */
            /* ** So a de cima sai; a de baixo do container fica, porque e ela que separa os   */
            /* ** chips da grade.                                                             */
            /* **                                                                             */
            /* ** O escopo em snk-filter-bar nao e enfeite: .ez-margin-top--extra-small e uma  */
            /* ** utilitaria generica do tema, usada tambem no snk-guides-viewer.js:548 — sem  */
            /* ** o descendente, zerar aqui mexeria no modo formulario tambem.                 */
            /* **                                                                             */
            /* ** !important pelo mesmo motivo da regra do modal abaixo: as folhas escopadas   */
            /* ** do Stencil entram no <head> depois deste bloco.                              */
            /* **                                                                             */
            snk-filter-bar .snk-filter-bar__filter-item-container,
            snk-filter-bar .ez-margin-top--extra-small {
                margin-top: 0 !important;
            }

            /* **                                                                             */
            /* ** MODAL "+ FILTROS": LARGURA MINIMA MENOR QUE A DA LIB                        */
            /* **                                                                             */
            /* ** O snk-filter-modal.css:5-8 declara min-width: 344px. Nesta tela isso sobra e */
            /* ** o modal fica desproporcional, entao baixamos para 295px.                    */
            /* **                                                                             */
            /* ** O !important e necessario, nao preguica: a regra da lib e escopada pelo      */
            /* ** Stencil (.snk-filter-modal__container.sc-snk-filter-modal, duas classes) e a */
            /* ** folha dela e injetada no <head> DEPOIS deste bloco. Uma regra de uma classe  */
            /* ** so perde por especificidade, e empatar perde pela ordem. A alternativa seria */
            /* ** repetir a classe de escopo no seletor, o que amarraria esta regra a um       */
            /* ** detalhe interno do build do Stencil.                                        */
            /* **                                                                             */
            .snk-filter-modal__container {
                min-width: 295px !important;
                overflow: hidden;
            }

            /* **                                                                             */
            /* ** EDITOR DE FILTRO PERSONALIZADO: ALTURA POR FLEX, NAO POR PORCENTAGEM        */
            /* **                                                                             */
            /* ** O overlay em si esta correto e foi medido na tela: position:fixed, top 0,   */
            /* ** altura igual a viewport, padding de 24px, sem containing block interferindo */
            /* ** (.filter-bar__personalized-filter, snk-filter-bar.css:40-54). O que estoura */
            /* ** e o miolo — o snk-personalized-filter.css dimensiona por porcentagem do PAI */
            /* ** INTEIRO:                                                                    */
            /* **                                                                             */
            /* **     .snk-personalized-filter { height: 100% }   (via variavel)              */
            /* **     .ez-box__main            { height: 90%  }                               */
            /* **                                                                             */
            /* ** sem descontar o cabecalho (snk-simple-bar), que fica ACIMA da caixa dentro  */
            /* ** do mesmo container. Cabecalho + 90% passa de 100%: a caixa do formulario    */
            /* ** avanca por cima do padding de baixo e encosta na borda da tela, e o excesso */
            /* ** ainda rola o conteudo, tirando o cabecalho do campo de visao.               */
            /* **                                                                             */
            /* ** Que essa folha nao e revisada da para ver duas linhas acima: `height` le a  */
            /* ** variavel --width e `width` le a --height. Como as duas valem 100%, nunca    */
            /* ** incomodou ninguem.                                                          */
            /* **                                                                             */
            /* ** A correcao e a mesma da cadeia de altura la em cima: porcentagem sai, flex  */
            /* ** entra, com min-height:0 para o item poder encolher — e a caixa ganha o      */
            /* ** proprio scroll, que e o comportamento certo quando o filtro tem muitas      */
            /* ** linhas de expressao.                                                        */
            /* **                                                                             */
            /* ** Os seletores ficam presos ao .filter-bar__personalized-filter de proposito: */
            /* ** .ez-box__main e classe generica do tema e nao pode ser afetada fora daqui.  */
            /* **                                                                             */
            snk-personalized-filter.filter-bar__personalized-filter > .snk-personalized-filter {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            snk-personalized-filter.filter-bar__personalized-filter .ez-box__main {
                height: auto;
                flex: 1 1 auto;
                min-height: 0;
                overflow: auto;
            }

            /* **                                                                             */
            /* ** MOLDURA UNICA: SO O PADDING DO #root                                        */
            /* **                                                                             */
            /* ** O snk-crud escreve ez-padding--medium (12px) no stack-item da grade e o     */
            /* ** snk-grid escreve ez-padding--large (24px) no .snk-grid__container — as duas */
            /* ** direto no render() (snk-crud.js:363, snk-grid.js:592), sem prop para        */
            /* ** desligar. Somadas ao #root davam tres molduras concentricas.                */
            /* **                                                                             */
            /* ** Os seletores tem duas classes de proposito: as utilitarias do tema tem uma  */
            /* ** so, entao estes vencem por especificidade e nao dependem da ordem em que a  */
            /* ** CSS do componente e injetada. O padding: 0 no container tambem cobre o      */
            /* ** var(--snk-grid-padding) do proprio snk-grid.css.                            */
            /* **                                                                             */
            stack-item.ez-padding--medium,
            .snk-grid__container.ez-padding--large {
                padding: 0 !important;
            }

            snk-taskbar.ez-padding-top--extra-small {
                padding-top: 0 !important;
            }

            /* **                                                                             */
            /* ** RESPIRO INTERNO DA GRADE                                                    */
            /* **                                                                             */
            /* ** A moldura que sobrou fica DENTRO do card, como na tela nativa: la o          */
            /* ** .ag-root-wrapper tem padding lateral e inferior de var(--space--medium).     */
            /* ** O bloco do AG Grid embutido no nosso ez-themed.css (linha 3003) so declara   */
            /* ** cursor/position/display/flex/overflow — a regra do padding e mais nova que   */
            /* ** a versao instalada aqui, entao ela vem deste arquivo.                        */
            /* **                                                                             */
            .ag-root-wrapper {
                /* Sem topo: quem separa do cabecalho e o proprio header da grade. */
                padding: 0 var(--bi--respiro-grade) var(--bi--respiro-grade) !important;

                /* O .ag-layout-normal e height: 100%, e o AG Grid nao aplica border-box aqui: */
                /* sem isto o respiro de baixo seria somado e estouraria a caixa.              */
                box-sizing: border-box;
            }

            /* **                                                                             */
            /* ** OVERLAY DE ERRO NO CARREGAMENTO                                             */
            /* **                                                                             */
            /* ** Escondido por padrao (display: none inline, no elemento). O script que      */
            /* ** repete o lote GraphQL (contexto do Sankhya, mais abaixo) troca esse display */
            /* ** para 'flex' quando a repeticao tambem falha. Fica fora de #root de          */
            /* ** proposito: se o React nunca chega a montar porque o lote falhou antes disso,*/
            /* ** o overlay ainda aparece.                                                    */
            /* **                                                                             */
            #bi-erro-carregamento {
                position: fixed;
                inset: 0;
                z-index: 999999;
                align-items: center;
                justify-content: center;
                background: rgba(0, 0, 0, 0.45);
            }

            .bi-erro-carregamento__caixa {
                max-width: 360px;
                padding: 24px;
                border-radius: 8px;
                background: #ffffff;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
            }

            .bi-erro-carregamento__titulo {
                margin: 0 0 8px;
                font-size: 16px;
                font-weight: bold;
                color: #333333;
            }

            .bi-erro-carregamento__texto {
                margin: 0 0 16px;
                font-size: 13px;
                line-height: 1.4;
                color: #666666;
            }

            .bi-erro-carregamento__botao {
                padding: 8px 20px;
                border: none;
                border-radius: 4px;
                background: #1976d2;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .bi-erro-carregamento__botao:hover {
                background: #1560ac;
            }
        </style>

        <!--@BI_STYLE@-->

    <!-- CONTEXTO DO SANKHYA -->

                        /* ** mesmo recurso — e nao mais metade em cada.                          */
                        /* **                                                                     */
                        /* ** O valor vem do bundle (src/index.tsx repassa a constante do         */
                        /* ** src/Dados.tsx). Sem ele a URL sai como antes.                       */
                        /* **                                                                     */
                        const destino = '/mge/html5component.mge?entryPoint='
                            + paginaInicial + '&nuGdg=' + nuGdg
                            + (resourceID ? '&resourceID=' + encodeURIComponent (resourceID) : '');

                        /* **                                                                     */
                        /* ** Resolve ANTES de trocar o innerHTML: a atribuicao abaixo destroi    */
                        /* ** este documento, e o que vier depois dela pode nunca rodar.           */
                        /* **                                                                     */
                        resolver (true);

                        alvo.innerHTML = '<iframe src="' + destino + '" class="gwt-Frame" '
                            + 'style="width: 100%; height: 100%;"></iframe>';

                    }, 500); });
                });

            };

        </script>
    <!-- -->

</head>
