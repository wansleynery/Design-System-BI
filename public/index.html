<!--
  Esta e a tela. O scripts/zip.js a transforma em build/index.jsp, embutindo o bundle.

  Por que .html e nao .jsp: o react-scripts EXIGE public/index.html (build.js:50 aborta sem
  ele), entao manter os dois seria duplicacao.

  ATENCAO: nao escreva scriptlets de JSP neste arquivo, nem dentro de comentarios. O
  HtmlWebpackPlugin passa tudo pelo lodash/template, que avalia a abertura de scriptlet como
  JavaScript e quebra o build — inclusive quando ela aparece so em prosa. Por isso as
  diretivas e o acesso a sessao viram marcadores, preenchidos por scripts/zip.js.

  A interpolacao da pasta base, essa sim, pode ficar literal no corpo da pagina: o loader do
  HtmlWebpackPlugin passa um `interpolate` proprio, e o lodash so ativa o modo ES-template
  quando esse regex e o default por referencia. Verificado. (Nao escrita aqui de proposito:
  o container tambem a resolveria dentro deste comentario, vazando o caminho no HTML.)

  Marcadores preenchidos por scripts/zip.js, um de cada, procure por "@" abaixo:
    JSP_DIRETIVAS  as tres diretivas de pagina (tem que ser a primeira linha do arquivo)
    JSP_USUARIO    a expressao que le o usuario logado da sessao
    BI_STYLE       tema ez-design + main.css, com as fontes woff2 em base64
    BI_SCRIPT      os 143 arquivos de JS concatenados

  Nao cite os marcadores por extenso aqui: a substituicao exige exatamente uma ocorrencia de
  cada, e uma citacao a mais faz o bundle ser embutido duas vezes.

  No `npm start` os marcadores ficam como estao e os scripts /mge/ dao 404. A tela monta
  assim mesmo: o removerFrame nao acha DashWindow fora de um gadget e retorna calado.
-->

            /* **                                                                                */
            /* ** O nome do Componente BI NAO fica aqui. Quem o consome e o BI.removerFrame, e   */
            /* ** ele e chamado de dentro do bundle, no src/index.tsx — que passa o nome direto. */
            /* ** Um campo aqui seria uma segunda fonte da verdade que ninguem le: ja foi assim, */

            /* **                                                                                 */
            /* ** SESSAO PARA O BFF (obrigatorio)                                                 */
            /* **                                                                                 */
            /* ** O DataFetcher do sankhyablocks monta a URL do GraphQL assim:                    */
            /* **   mgeSession = window['mgeSession'] || urlParams.get('mgeSession')              */
            /* ** A URL do html5component.mge nao traz esse parametro, entao sem isto a chamada   */
            /* ** sai como /mgefin-bff/graphql?mgeSession=undefined e o BFF responde 401          */
            /* ** "Not authenticated".                                                            */
            /* **                                                                                 */
            /* ** O valor e o cookie JSESSIONID sem o sufixo de jvmRoute (o que vem apos o ponto) */
            /* ** — mesma formula usada pelo jsnk do projeto de injecao de telas, lida direto do  */

                (function () {

                    window.mgeSession = decodeURIComponent (achado [1]).replace (/\..*/, '');

            /* ** */

            /* **                                                                                 */
            /* ** UMA REPETICAO DO LOTE GRAPHQL EM ERRO 5xx                                       */
            /* **                                                                                 */
            /* ** O snk-application abre a tela com um lote de ~8 queries num unico POST           */
            /* ** (graphql-request/batchRequests). Se esse POST falha, falha inteiro: metadados,  */
            /* ** permissoes e configuracoes de grade e formulario somem de uma vez e a tela nao  */
            /* ** monta. Nao ha ponto unico de falha maior nesta pagina.                          */
            /* **                                                                                 */
            /* ** Ja foi visto um 500 de corpo vazio nesse lote, intermitente: o mesmo payload,   */
            /* ** com as mesmas variaveis e a mesma sessao, reenviado do console, responde 200 —  */
            /* ** as oito queries, uma a uma e em lote. Ou seja, a causa esta do lado do servidor */
            /* ** e nao no que mandamos; daqui so da para nao deixar a tela morrer por causa      */
            /* ** dela.                                                                           */
            /* **                                                                                 */
            /* ** Condicoes para repetir, todas necessarias:                                      */
            /* **                                                                                 */
            /* **   - URL de GraphQL. O service.sbr sai por XHR e nem passa por aqui;             */
            /* **   - status >= 500. Erro de negocio do BFF vem como 200 + errors[], e 401/403    */
            /* **     nao melhoram com insistencia;                                               */
            /* **   - corpo em texto e SEM "mutation". O mesmo endpoint grava (saveData,          */
            /* **     saveResource, filtros personalizados) e reenviar gravacao duplica registro. */
            /* **                                                                                 */
            /* ** Precisa estar AQUI, antes do bundle: o cross-fetch, que o graphql-request usa,  */
            /* ** copia a referencia de window.fetch quando o modulo dele e avaliado              */
            /* ** (browser-ponyfill.js, `var ctx = __global__.fetch ? ...`). Trocar o global mais */
            /* ** tarde, de dentro do React, nao alcanca mais nada.                               */
            /* **                                                                                 */
            /* ** Se a repeticao TAMBEM vier >= 500, desistimos de tentar sozinhos e mostramos o  */
            /* ** overlay de #bi-erro-carregamento (marcacao e CSS no <head>/<body> deste mesmo   */
            /* ** arquivo) com um botao "Recarregar". Ele faz window.location.reload() — que      */
            /* ** recarrega so este documento (o iframe em tela cheia que o removerFrame monta),  */
            /* ** nunca a janela do shell do Sankhya, entao as outras abas/telas abertas na mesma  */
            /* ** sessao do usuario nao sao afetadas.                                             */
            /* **                                                                                 */
                (function () {

                    const fetchOriginal = window.fetch.bind (window);
                    const ESPERA_MS     = 400;

                    const esperar = function (ms) {
                        return new Promise (function (resolver) { setTimeout (resolver, ms); });
                    };

                    const mostrarErroCarregamento = function () {

                        const overlay = document.getElementById ('bi-erro-carregamento');

                        if (!overlay) return;

                        overlay.style.display = 'flex';

                    };

                    window.fetch = function (recurso, opcoes) {

                        const url = typeof recurso === 'string'
                            ? recurso : (recurso && recurso.url) || '';

                        if (url.indexOf ('/graphql') === -1) return fetchOriginal (recurso, opcoes);

                        return fetchOriginal (recurso, opcoes).then (function (resposta) {

                            const corpo = opcoes && opcoes.body;

                            const repetivel = resposta.status >= 500
                                && typeof corpo === 'string'
                                && corpo.indexOf ('mutation') === -1;

                            if (!repetivel) return resposta;

                            console.warn (
                                '[bi] GraphQL respondeu ' + resposta.status
                                + ' — repetindo o lote uma vez em ' + ESPERA_MS + 'ms.'
                            );

                            return esperar (ESPERA_MS).then (function () {
                                return fetchOriginal (recurso, opcoes);
                            }).then (function (respostaRepetida) {

                                if (respostaRepetida.status >= 500) {
                                    console.error (
                                        '[bi] repeticao tambem respondeu '
                                        + respostaRepetida.status + ' — desistindo.'
                                    );
                                    mostrarErroCarregamento ();
                                }

                                return respostaRepetida;

                            });

                        }).catch (function (erro) {

                            /* Falha de rede (sem nem chegar a ter status HTTP) tambem esgota a  */
                            /* tentativa: nao ha o que repetir sem uma resposta para inspecionar. */
                            mostrarErroCarregamento ();
                            throw erro;

                        });

                    };

                }) ();

            /* **                                                                                */

        <script type="text/javascript">

            window.BI = window.BI || {};

            /* **                                                                                 */
            /* ** O nuGdg que ja esta na URL desta pagina, se houver. Quando o shell monta o      */
            /* ** gadget ele passa esse parametro, e ai o valor e exato por construcao: nao       */
            /* ** depende de titulo, de seletor de DOM nem de permissao em servico nenhum.        */
            /* ** E a fonte preferida; as outras duas existem para quando ele nao vier.           */
            /* **                                                                                 */
            function nuGdgDaUrl () {

                try {

                    const parametros = new URLSearchParams (window.location.search);

                    let encontrado = null;

                    /* Comparacao sem caixa: o nome do parametro ja apareceu grafado de formas    */
                    /* diferentes entre versoes do Sankhya.                                       */
                    parametros.forEach (function (valor, chave) {
                        if (chave.toLowerCase () === 'nugdg' && valor && valor !== '0') {
                            encontrado = valor;
                        }
                    });

                    return encontrado;

                } catch (erro) { return null; }

            }

            /* **                                                                                 */
            /* ** Descobre o nuGdg do gadget pelo titulo cadastrado, como o original fazia com o  */
            /* ** JX.consultar. Exige permissao no DbExplorerSP.executeQuery.                     */
            /* **                                                                                 */
            /* ** O apostrofo do titulo e duplicado antes de entrar no SQL. O original concatena  */
            /* ** direto, e um componente chamado O'Brien quebraria a consulta.                   */
            /* **                                                                                 */
            function obterNuGdg (instancia) {

                const daUrl = nuGdgDaUrl ();

                if (daUrl) return Promise.resolve (daUrl);

                if (!instancia) {
                    console.warn ('[bi] sem nuGdg na URL e sem nome de instancia — a moldura fica.');
                    return Promise.resolve (0);
                }

                const url = window.location.origin
                    + '/mge/service.sbr?serviceName=DbExplorerSP.executeQuery&outputType=json';

                const sql = "SELECT NUGDG FROM TSIGDG WHERE TITULO = '"
                    + String (instancia).replace (/'/g, "''") + "'";

                return window.fetch (url, {
                    method      : 'POST',
                    redirect    : 'follow',
                    credentials : 'include',
                    headers     : { 'Content-Type': 'application/json; charset=UTF-8' },
                    body        : JSON.stringify ({
                        serviceName : 'DbExplorerSP.executeQuery',
                        requestBody : { sql: sql }
                    })
                })
                .then (function (resposta) { return resposta.json (); })
                .then (function (json) {

                    /* O servico responde ora com responseBody na raiz, ora dentro de data. */
                    const corpo  = (json && json.responseBody)
                        || (json && json.data && json.data.responseBody);
                    const linhas = corpo && corpo.rows;

                    const achado = linhas && linhas.length && linhas [0] [0];

                    if (!achado) {
                        console.warn (
                            '[bi] nenhum gadget com TITULO = "' + instancia + '" em TSIGDG. '
                            + 'Confira o nome em src/index.tsx (case sensitive) — a moldura fica.'
                        );
                    }

                    return achado || 0;

                })
                .catch (function (erro) {
                    console.warn ('[bi] falha ao consultar o nuGdg — a moldura fica.', erro);
                    return 0;
                });

            }

            /* **                                                                                 */
            /* ** Troca o conteudo do gadget por um iframe da propria tela, em tela cheia.        */
            /* **                                                                                 */
            /* ** A guarda do DashWindow e o que impede o laco infinito: a pagina recarregada     */
            /* ** dentro do iframe novo nao tem essa classe no pai, entao a segunda execucao para */
            /* ** aqui. O original so checa isso depois da consulta; checar antes evita disparar  */
            /* ** um SELECT toda vez que a tela roda fora de um gadget (o `npm start`, p.ex.).    */
            /* **                                                                                 */
            /* ** Os 500ms sao do original e seguram a troca ate o shell terminar de montar o     */
            /* ** gadget. Ficaram como estao.                                                     */
            /* **                                                                                 */
            /* ** DEVOLVE UMA PROMISE<BOOLEAN>: true quando este documento acabou de ser          */
            /* ** substituido, false quando a moldura ficou (fora de gadget, sem nuGdg, pai       */
            /* ** inacessivel). O src/index.tsx usa isso para NAO montar o React numa pagina que  */
            /* ** ja esta condenada — sem isso a tela sobe duas vezes por abertura, e as duas     */
            /* ** cargas disputam o mesmo lote de queries no BFF com 500ms de diferenca.          */
            /* **                                                                                 */
            /* ** Todos os caminhos precisam resolver: uma promise pendente aqui deixa a tela em  */
            /* ** branco la.                                                                      */
            /* **                                                                                 */
            window.BI.removerFrame = function (configuracoes) {

                const opcoes        = configuracoes || {};
                const paginaInicial = opcoes.paginaInicial || 'index.jsp';
                const resourceID    = opcoes.resourceID || '';

                let instancia = opcoes.instancia || '';
                let pai;

                /* Fora do Sankhya, ou em pai de outra origem, nao ha moldura para remover. */
                try { pai = window.parent.document; }
                catch (erro) { return Promise.resolve (false); }

                if (!pai || !pai.getElementsByClassName ('DashWindow') [0]) {
                    return Promise.resolve (false);
                }

                /* Esconde o alerta do shell e trava a rolagem nos dois niveis acima. */
                [window.parent, window.parent.parent].forEach (function (janela) {
                    try {

                        const documento = janela.document;
                        const alerta    = documento.querySelector ('div.gwt-PopupPanel.alert-box.box-shadow');

                        if (alerta)          alerta.style.display   = 'none';
                        if (documento.body)  documento.body.style.overflow = 'hidden';

                    } catch (erro) { /* nivel inacessivel: ignora */ }
                });

                /* **                                                                             */
                /* ** O titulo no cabecalho do gadget vence o nome passado, como no original: ele */
                /* ** e o nome do card que esta REALMENTE em tela, enquanto o valor do            */
                /* ** src/index.tsx e uma constante compilada, que pode estar desatualizada ou    */
                /* ** ainda no texto de exemplo. O seletor depende de uma classe gerada pelo GWT  */
                /* ** (GI-BUHVBPVC), que muda entre versoes do Sankhya — por isso o nome passado  */
                /* ** continua valendo como plano B.                                              */
                /* **                                                                             */
                try {

                    const cabecalho = pai.querySelector (
                        'div.GI-BUHVBPVC > div > div > div > div > div > table > tbody > tr > td > div'
                    );

                    if (cabecalho && cabecalho.textContent.trim ()) {
                        instancia = cabecalho.textContent.trim ();
                    }

                } catch (erro) { /* seletor nao casou: fica o nome passado */ }

                return obterNuGdg (instancia).then (function (nuGdg) {
                    return new Promise (function (resolver) { setTimeout (function () {

                        const alvo = pai.getElementsByClassName ('dyna-gadget') [0];

                        if (!alvo) { resolver (false); return; }

                        /* **                                                                     */
                        /* ** Sem nuGdg nao ha troca. Recarregar com nuGdg=0 leva a uma tela que  */
                        /* ** o ERP nao consegue resolver — pior que ficar na moldura pequena,    */
                        /* ** que ao menos funciona. Os avisos acima dizem o que faltou.          */
                        /* **                                                                     */
                        if (!nuGdg || nuGdg === '0') { resolver (false); return; }

                        /* **                                                                     */
                        /* ** O caminho e relativo a pasta customizada — o container resolve o    */
                        /* ** resto.                                                              */
                        /* **                                                                     */
                        /* ** O resourceID entra aqui porque esta e a UNICA URL desta tela que    */
                        /* ** escrevemos: a primeira, montada pelo shell, nao aceita parametro    */
                        /* ** nosso. O snk-application le urlParams.get('resourceID') antes de    */
                        /* ** cair em 'unknown.resource.id', entao a pagina recarregada dentro    */
                        /* ** deste iframe resolve grade, formulario, resumo e permissoes no      */
                        /* ** mesmo recurso — e nao mais metade em cada.                          */
                        /* **                                                                     */
                        /* ** O valor vem do bundle (src/index.tsx repassa a constante do         */
                        /* ** src/Dados.tsx). Sem ele a URL sai como antes.                       */
                        /* **                                                                     */
                        const destino = '/mge/html5component.mge?entryPoint='
                            + paginaInicial + '&nuGdg=' + nuGdg
                            + (resourceID ? '&resourceID=' + encodeURIComponent (resourceID) : '');

                        /* **                                                                     */
                        /* ** Resolve ANTES de trocar o innerHTML: a atribuicao abaixo destroi    */
                        /* ** este documento, e o que vier depois dela pode nunca rodar.           */
                        /* **                                                                     */
                        resolver (true);

                        alvo.innerHTML = '<iframe src="' + destino + '" class="gwt-Frame" '
                            + 'style="width: 100%; height: 100%;"></iframe>';

                    }, 500); });
                });

            };

        </script>
    <!-- -->

</head>
